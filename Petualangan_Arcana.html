<title>Petualangan Arcana</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg1:#f6eefc;--bg2:#dfe9ff;--glow:#e9d5ff;--glow2:#fde68a;
  --card:#ffffffcc;--text:#2a1f4a;--muted:#6b5f8f;--line:#d3c6f2;
  --accent:#7c3aed;--accent2:#f59e0b;--good:#16a34a;--bad:#dc2626;--btn:#6d28d9;--btntext:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg1:#140b2e;--bg2:#2a1458;--glow:#5b21b6aa;--glow2:#92400e55;
    --card:#ffffff14;--text:#f3ecff;--muted:#b7a9e0;--line:#ffffff2e;
    --accent:#a78bfa;--accent2:#fbbf24;--good:#4ade80;--bad:#f87171;--btn:#6d28d9;--btntext:#ffffff;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg1:#140b2e;--bg2:#2a1458;--glow:#5b21b6aa;--glow2:#92400e55;
  --card:#ffffff14;--text:#f3ecff;--muted:#b7a9e0;--line:#ffffff2e;
  --accent:#a78bfa;--accent2:#fbbf24;--good:#4ade80;--bad:#f87171;--btn:#6d28d9;--btntext:#ffffff;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--text);background-color:var(--bg1);
  background-image:radial-gradient(circle at 15% 10%,var(--glow) 0,transparent 40%),radial-gradient(circle at 85% 85%,var(--glow2) 0,transparent 45%),linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-family:Georgia,"Times New Roman",serif;text-align:center;font-size:29px;margin:8px 0 4px;text-shadow:0 0 18px var(--accent)}
.sub{text-align:center;color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(6px)}
.realms{display:grid;gap:10px}
.realm{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;transition:transform .15s,border-color .15s}
.realm:hover{transform:translateY(-2px);border-color:var(--accent)}
.realm .ic{font-size:34px}
.realm b{display:block;font-size:16px}
.realm small{display:block;color:var(--muted)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:bold;margin-bottom:10px;flex-wrap:wrap}
.arena{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 18px;margin-bottom:10px}
.fig{text-align:center;font-size:54px;line-height:1}
.fig small{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.mon{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.fig{position:relative}
.lunge{animation:lunge .9s ease-in-out}
@keyframes lunge{0%{transform:translateX(0)}35%{transform:translateX(min(34vw,170px)) rotate(10deg) scale(1.2)}55%{transform:translateX(min(34vw,170px)) rotate(-6deg) scale(1.2)}100%{transform:translateX(0)}}
.mlunge{animation:mlunge .9s ease-in-out}
@keyframes mlunge{0%{transform:translateX(0)}35%{transform:translateX(max(-34vw,-170px)) rotate(-10deg) scale(1.2)}55%{transform:translateX(max(-34vw,-170px)) rotate(6deg) scale(1.2)}100%{transform:translateX(0)}}
.fx{position:absolute;left:50%;top:10%;font-size:48px;pointer-events:none;animation:fx .6s .35s both}
@keyframes fx{0%{transform:translateX(-50%) scale(0) rotate(-30deg);opacity:0}40%{transform:translateX(-50%) scale(1.5) rotate(10deg);opacity:1}100%{transform:translateX(-50%) scale(1) translateY(-26px);opacity:0}}
.hit{animation:shake .5s .35s backwards}
@keyframes shake{20%{transform:translateX(-8px) rotate(-6deg)}50%{transform:translateX(8px) rotate(6deg)}80%{transform:translateX(-4px)}}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--accent2));transition:width .4s}
.timer{margin:0 0 10px}
.timer i{width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:none}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--btn);color:var(--btntext);margin-bottom:8px}
.q{font-size:19px;line-height:1.45;margin:0 0 12px}
.opts{display:grid;gap:8px}
.btn{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--accent);transform:translateX(2px)}
.btn:disabled{cursor:default}
.btn.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 25%,transparent)}
.btn.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 25%,transparent)}
.go{background:var(--btn);color:var(--btntext);border-color:var(--btn);text-align:center;font-weight:bold}
.mini{padding:2px 10px;font-size:13px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text)}
.fb{margin-top:12px;padding:12px;border-radius:12px;border:2px solid var(--line);line-height:1.5}
.fb.ok{border-color:var(--good)}.fb.no{border-color:var(--bad)}
.center{text-align:center}
.stars{font-size:44px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .5s backwards}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
#world{max-width:640px;margin:0 auto;padding:8px 16px}
.stage{position:relative}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;border:3px solid #2b1d12;border-radius:6px;touch-action:none;background:#7cc14a}
.pf,.tr,#chat{position:absolute;color:#fff;font:bold 10px monospace}
.pf{top:6px;left:6px;display:flex;gap:6px;align-items:center;background:#000a;border:2px solid #fff4;border-radius:6px;padding:4px 6px;pointer-events:none}
.av{font-size:28px;background:#2b2b3a;border:2px solid #fff5;border-radius:4px;padding:2px 4px}
.sb{position:relative;width:100px;height:11px;margin:2px 0;background:#0008;border:1px solid #fff5}
.sb i{position:absolute;inset:0 auto 0 0;display:block;width:100%;background:var(--accent2)}
.sb b{position:relative;display:block;font-size:8px;line-height:11px;text-align:center}
.tr{top:6px;right:6px;display:flex;gap:4px}
.tr button{font-size:17px;padding:2px 5px;background:#000a;border:2px solid #fff4;border-radius:6px;cursor:pointer}
#chat{left:6px;bottom:6px;width:60%;padding:4px 6px;background:#000a;border:1px solid #fff3;border-radius:4px;font-weight:normal;font-size:11px;line-height:1.35;pointer-events:none}
#chat .y{color:#ff3}#chat .g{color:#6f6}#chat .r{color:#f77}#chat .o{color:#fa4}
.b2{margin-top:8px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.xp{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:bold;margin-bottom:6px}
.xp .sb{flex:1;width:auto}
.slots{display:flex;gap:4px;justify-content:center}
.slot{flex:1;max-width:44px;aspect-ratio:1;position:relative;font-size:20px;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:6px;cursor:pointer;padding:0}
.slot small{position:absolute;right:3px;bottom:1px;font-size:9px;color:var(--muted)}
.pop{display:none;position:absolute;left:6%;right:6%;top:8%;max-height:84%;overflow:auto;background:#1b1233f2;color:#fff;border:2px solid #fff5;border-radius:10px;padding:10px;font:13px/1.4 system-ui,sans-serif}
.pop.on{display:block}
.pop .btn{width:100%;margin-top:6px;padding:8px;font-size:14px;color:#fff;background:#ffffff18;border-color:#fff4}
.pop .btn.go{background:var(--btn)}
.pop p{margin:6px 0}
.lbr{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px}
.lbr span:nth-child(2){flex:1}
.lbr.me{background:#fbbf2444;outline:1px solid #fbbf24}
.lbn{display:flex;gap:6px;margin:6px 0}
.lbn input{font-size:14px;padding:6px;color:#fff;background:#ffffff18;border-color:#fff4}
.lbn .btn{width:auto;margin:0}
.slot sup{position:absolute;left:3px;top:1px;font-size:10px;font-weight:bold;color:var(--text)}
#tags{position:absolute;inset:3px;overflow:hidden;pointer-events:none}
#tags span{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font:bold 12px "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#ff3;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 3px #000}
#tags span.n{color:#7df}#tags span.x{font-size:14px;text-shadow:none}#tags span.h{color:#d9ffb0;font-size:11px}#tags span.ft{font-size:12px;font-weight:900}
.lbr .del{padding:0 6px;font-size:13px;background:#ffffff18;border:1px solid #fff4;border-radius:6px;color:#fff;cursor:pointer}
.adm{margin-top:10px;padding:8px;border:1px dashed #fbbf24;border-radius:8px}
.pop .btn.bad{background:#b91c1c;border-color:#ef4444}
/* ruang admin: panel gelap berbingkai emas, terpisah dari papan peringkat */
/* halaman ruang admin: panel gelap yang sengaja tetap gelap di kedua tema */
.adm-page{border:2px dashed #fbbf24;border-radius:16px;padding:14px;background:#1d1233;color:#f3ecff;margin-top:10px}
.adm-page .btn{background:#ffffff18;color:#f3ecff;border-color:#ffffff44}
.adm-page .btn.go{background:#6d28d9;color:#fff;border-color:#6d28d9}
.adm-page .btn.bad{background:#b91c1c;color:#fff;border-color:#ef4444}
.adm-h{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #fbbf2466;padding-bottom:6px;margin-bottom:8px}
.adm-h b{font-family:Georgia,"Times New Roman",serif;font-size:17px;color:#fde68a}
.adm-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.adm-stat div{background:#ffffff14;border:1px solid #fff3;border-radius:8px;padding:6px;text-align:center}
.adm-stat b{display:block;font-size:17px;color:#fde68a;font-variant-numeric:tabular-nums}
.adm-stat small{color:#e9d5ff;font-size:11px}
.adm-row{display:flex;gap:6px;align-items:center;padding:5px 2px;border-bottom:1px solid #fff1}
.adm-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-row b{font-variant-numeric:tabular-nums}
.adm-row button{font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid #fff4;background:#ffffff18;color:#fff;cursor:pointer}
.adm-row button.arm{background:#b91c1c;border-color:#ef4444}
.adm-reset{margin-top:10px;padding:8px;border:1px dashed #ef4444;border-radius:8px}
.adm-reset .lbn input{font-size:14px;padding:6px;color:#fff;background:#ffffff18;border-color:#fff4;text-transform:uppercase}
.adm-reset .btn:disabled{opacity:.45;cursor:not-allowed}
.adm-log{margin-top:8px;font-size:12px;color:#fde68a;min-height:16px}
/* karakter, gacha, tas, aksi (v5) */
.ket{font-size:12px;opacity:.92;margin:6px 0;line-height:1.4}
.pesan{background:#fbbf2433;border:1px solid #fbbf2466;border-radius:8px;padding:6px 8px;font-weight:bold;margin:6px 0}
.kisi{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.kartu{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font:inherit;font-size:11px;color:#fff;text-align:left;width:100%;margin:0;cursor:pointer;background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 38%,transparent),#ffffff10 75%);border:2px solid var(--rc);border-radius:12px;padding:7px;line-height:1.25;transition:transform .12s}
.kartu:hover{transform:translateY(-2px)}
.kartu .ke{font-size:28px;line-height:1;align-self:center;filter:drop-shadow(0 2px 2px #0008)}
.kartu b{font-size:12px}
.kartu small{opacity:.92}
.kartu em{font-style:normal;font-weight:bold;color:#fde68a}
.kartu.kunci{filter:grayscale(.75);opacity:.6}
.kartu.aktif{box-shadow:0 0 0 2px #fde047,0 0 14px var(--rc)}
.gh{display:inline-block;margin:2px;padding:2px 6px;border:1px solid;border-radius:6px;font-size:12px}
.sumber-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.sumber{background:#ffffff14;border:1px solid #fff3;border-radius:8px;padding:5px;text-align:center;font-size:12px}
.sumber b{display:block;font-size:15px;color:#fde68a}
.petbaris{display:flex;gap:8px;align-items:center;padding:6px;border-bottom:1px solid #fff2}
.petbaris .ke{font-size:24px}
.petbaris div{flex:1}
.petbaris .btn{width:auto;margin:0;padding:6px 10px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.acts .btn{font-size:13px;padding:8px 4px;text-align:center;width:100%;margin:0}
.skill{margin-top:12px}
.skbtn{width:100%;display:flex;flex-direction:column;gap:2px}
.skbtn small{font-size:12px;opacity:.85}
.pop .btn:disabled{opacity:.45;cursor:not-allowed}
/* v6.6: dunia layar penuh tanpa latar ungu-putih; bar item & aksi di dalam permainan; panduan lewat tombol ❓ */
body.dunia{background:#07050f;background-image:none}
body.dunia #world{position:fixed;inset:0;max-width:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:space-between;background:#07050f;overflow:hidden}
body.dunia .stage{position:relative;flex:none;margin:auto;width:min(100vw,calc((100dvh - var(--barH,0px)) * 1.6));aspect-ratio:256/160}
body.dunia #cv{width:100%;height:100%;border:0;border-radius:0}
body.dunia .b2{flex:none;margin:0;border-radius:0;border:0;border-top:2px solid #ffffff1f;background:#0c0918f2;padding:6px 10px 8px}
body.dunia .acts{margin-top:6px}
body.dunia .acts .btn{padding:6px 2px;font-size:12px}
#info{padding:14px;line-height:1.5}
#info p{margin:8px 0}
#info .btn{width:100%;margin-top:8px}
</style>

<script>
/* =====================================================
   PENGATURAN (ubah angka di sini untuk menyetel game)
   ===================================================== */
const CONFIG = {
  SOAL_PER_RONDE: 10,      // jumlah soal tiap pertarungan
  NYAWA: 3,                // jumlah hati pemain; habis = kalah
  WAKTU_PER_SOAL: 20,      // detik per soal; isi 0 untuk mematikan timer
  POIN_BENAR: 100,         // poin dasar untuk jawaban benar
  BONUS_KOMBO: 25,         // bonus poin per kombo beruntun (mulai kombo ke-2)
  BONUS_WAKTU: 2,          // bonus poin per detik sisa waktu
  TINGKAT_MATEMATIKA: 1    // 1 = mudah, 2 = sedang, 3 = sulit
};

/* Dunia / mata pelajaran: i = ikon, mon = emoji monster, mn = nama monster */
const DUNIA = {
  mate: {n:"Menara Hitung", m:"Matematika", i:"🔢", d:"Kalahkan goblin dengan sihir angka!", mon:"👹", mn:"Goblin Angka"},
  bio:  {n:"Hutan Peri", m:"Biologi", i:"🌿", d:"Pelajari rahasia makhluk hidup.", mon:"🕷️", mn:"Laba-laba Hutan"},
  geo:  {n:"Peta Naga", m:"Geografi", i:"🗺️", d:"Jelajahi benua, samudra, dan negara.", mon:"🦑", mn:"Kraken Peta"},
  mix:  {n:"Arena Campuran", m:"Mate + Bio + Geo", i:"🐉", d:"Semua ilmu sekaligus. Berani?", mon:"🐉", mn:"Naga Kegelapan"}
};

/* =====================================================
   BANK SOAL (tinggal tambah baris baru untuk menambah soal)
   Format:
   ["mc",   "pertanyaan", "jawaban benar", ["salah1","salah2","salah3"], "penjelasan"]
   ["tf",   "pernyataan", true atau false, "penjelasan"]
   ["fill", "pertanyaan", ["jawaban diterima","alternatif"], "penjelasan"]
   ===================================================== */
const BANK = {
  bio: [
    ["mc","Organel sel yang dijuluki “pembangkit tenaga” sel adalah…","Mitokondria",["Ribosom","Nukleus","Vakuola"],"Mitokondria mengubah makanan menjadi energi (ATP)."],
    ["tf","Paus adalah jenis ikan.",false,"Paus bernapas dengan paru-paru dan menyusui anaknya, jadi ia mamalia."],
    ["fill","Gas yang diserap tumbuhan untuk berfotosintesis adalah… (dua kata)",["karbon dioksida","karbondioksida","co2"],"Tumbuhan memakai CO₂, air, dan cahaya untuk membuat glukosa dan oksigen."],
    ["mc","Hewan pemakan tumbuhan disebut…","Herbivora",["Karnivora","Omnivora","Insektivora"],"Herbi = tumbuhan, vora = pemakan."],
    ["tf","Tulang terkecil pada tubuh manusia terletak di telinga.",true,"Tulang sanggurdi (stapes) di telinga tengah adalah tulang terkecil."],
    ["fill","Berapa jumlah ruang pada jantung manusia?",["4","empat"],"Dua serambi dan dua bilik."],

/* =====================================================
   MESIN GAME (bagian di bawah ini tidak perlu diubah)
   ===================================================== */
const $ = s => document.querySelector(s);
const app = $("#app");
const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
const norm = x => String(x).toLowerCase().trim().replace(/\s+/g, " ");
const pool = {bio: [], geo: []};
let G = null, tm = null;

function mc(q, benar, salah, e) {
  const o = shuffle([benar, ...salah]);
  return {t:"mc", q, o, a:o.indexOf(benar), e, tampil:benar};
}
function numMC(q, n, e) {
  const s = new Set();
  while (s.size < 3) { const d = n + R(-10, 10); if (d !== n && d >= 0) s.add(d); }
  return mc(q, String(n), [...s].map(String), e);
}
const fillNum = (q, n, e) => ({t:"fill", q, a:[String(n)], e, tampil:String(n), num:true});

function soalMate() {
  const L = Math.min(3, Math.max(1, CONFIG.TINGKAT_MATEMATIKA));
  const mx = [20, 60, 150][L - 1], k = [[2, 9], [3, 12], [6, 15]][L - 1];
  const j = R(0, 5);
  if (j === 0) {
    let a = R(5, mx), b = R(5, mx);
    if (Math.random() < .5) return numMC(`${a} + ${b} = …`, a + b, `${a} + ${b} = ${a + b}`);
    if (a < b) [a, b] = [b, a];
    return numMC(`${a} − ${b} = …`, a - b, `${a} − ${b} = ${a - b}`);
  }
  if (j === 1) { const a = R(...k), b = R(...k); return numMC(`${a} × ${b} = …`, a * b, `${a} × ${b} = ${a * b}`); }
  if (j === 2) { const b = R(...k), h = R(...k); return fillNum(`${b * h} ÷ ${b} = …`, h, `${b} × ${h} = ${b * h}, jadi ${b * h} ÷ ${b} = ${h}`); }
  if (j === 3) {
    const a = R(...k), b = R(...k), benar = Math.random() < .5;
    const tampil = benar ? a * b : a * b + R(1, 3) * (Math.random() < .5 ? -1 : 1);
    return {t:"tf", q:`${a} × ${b} = ${tampil}`, a:benar, e:`${a} × ${b} sebenarnya ${a * b}.`, tampil:benar ? "Benar" : "Salah"};
  }
  if (j === 4) { const a = R(3, mx / 2), x = R(2, mx / 2); return fillNum(`Jika x + ${a} = ${a + x}, maka x = …`, x, `x = ${a + x} − ${a} = ${x}`); }
  const p = [10, 25, 50][R(0, 2)], base = R(1, 10) * 20;
  return fillNum(`${p}% dari ${base} = …`, base * p / 100, `${base} × ${p}/100 = ${base * p / 100}`);
}

function bangun(b) {
  const [t, q, x, y, z] = b;
  if (t === "mc") return mc(q, x, y, z);
  if (t === "tf") return {t, q, a:x, e:y, tampil:x ? "Benar" : "Salah"};
  return {t, q, a:x, e:y, tampil:x[0]};
}
function ambil(k) {
  let s;
  if (k === "mate") s = soalMate();
  else { if (!pool[k].length) pool[k] = shuffle(BANK[k]); s = bangun(pool[k].pop()); }
  s.k = k;
  return s;
}

function muat() { try { return JSON.parse(localStorage.getItem("arcana_best") || "{}"); } catch (e) { return {}; } }
function simpan(k, v) {
  try { const b = muat(); if (v > (b[k] || 0)) { b[k] = v; localStorage.setItem("arcana_best", JSON.stringify(b)); } } catch (e) {}
}

function menu() {
  clearInterval(tm);
  const best = muat();
  app.innerHTML = `<h1>⚔️ Petualangan Arcana</h1>
  <p class="sub">Kalahkan monster dengan otakmu, bukan pedang!</p>
  <div class="realms">${Object.entries(DUNIA).map(([k, d]) =>
    `<button class="realm" data-d="${k}"><span class="ic">${d.i}</span><span><b>${d.n} · ${d.m}</b><small>${d.d}</small>${best[k] ? `<small>🏆 Rekor: ${best[k]}</small>` : ""}</span></button>`).join("")}</div>
  <div class="card" style="margin-top:14px;line-height:1.6"><b>📜 Cara bermain</b><br>
  Jawab ${CONFIG.SOAL_PER_RONDE} soal. Jawaban benar melukai monster; salah atau kehabisan waktu mengurangi ❤️. Benar beruntun memberi 🔥 kombo bonus. Ada 3 jenis soal: pilihan ganda, benar atau salah, dan isian singkat.</div>`;
}

function mulai(d) {
  const arr = Array.from({length: CONFIG.SOAL_PER_RONDE}, (_, i) => ambil(d === "mix" ? ["mate", "bio", "geo"][i % 3] : d));
  G = {d, s: d === "mix" ? shuffle(arr) : arr, i:0, nyawa:CONFIG.NYAWA, skor:0, kombo:0, benar:0, kunci:false, sisa:0, skillDipakai:false, lindung:false, ganda:false, maks:CONFIG.NYAWA};
  tanya();
}

function atas(a) {
  const D = DUNIA[G.d], hp = Math.round(100 * (1 - G.benar / G.s.length));
  $("#hud").innerHTML = `<span>${"❤️".repeat(G.nyawa)}${"🖤".repeat(Math.max(0, (G.maks || CONFIG.NYAWA) - G.nyawa))}</span><span>Soal ${G.i + 1}/${G.s.length}</span><span>⭐ ${G.skor}</span>${G.kombo > 1 ? `<span>🔥 x${G.kombo}</span>` : ""}<button class="btn mini" data-a="menu" aria-label="Keluar">✖</button>`;
  $("#arena").innerHTML = `<div class="fig"><div class="${a === "n" ? "hit" : a === "m" ? "lunge" : ""}">${HERO[HI].e}</div>${a === "n" ? '<span class="fx">💢</span>' : ""}<small>Kamu</small></div>
  <div class="fig" style="width:55%"><div class="${a === "m" ? "hit" : a === "n" ? "mlunge" : "mon"}">${D.mon}</div>${a === "m" ? '<span class="fx">💥</span>' : ""}<small>${D.mn}</small><div class="bar"><i style="width:${hp}%"></i></div></div>`;
}

function tanya() {
  const s = G.s[G.i];
  G.kunci = false; G.sisa = CONFIG.WAKTU_PER_SOAL;
  const label = {mc:"Pilihan Ganda", tf:"Benar atau Salah", fill:"Isian Singkat"}[s.t];
  let ui;
  if (s.t === "mc") ui = `<div class="opts">${s.o.map((o, k) => `<button class="btn" data-k="${k}">${"ABCD"[k]}. ${o}</button>`).join("")}</div>`;
  else if (s.t === "tf") ui = `<div class="opts"><button class="btn" data-k="1">✅ Benar</button><button class="btn" data-k="0">❌ Salah</button></div>`;
  else ui = `<div class="row"><input id="isi" autocomplete="off" autocapitalize="off" ${s.num ? 'inputmode="numeric"' : ""} placeholder="Ketik jawabanmu…"><button class="btn go" data-k="isi">⚔️ Serang!</button></div>`;
  app.innerHTML = `<div class="hud" id="hud"></div><div class="card arena" id="arena"></div>
  ${CONFIG.WAKTU_PER_SOAL ? '<div class="bar timer"><i id="tbar"></i></div>' : ""}
  <div class="card"><span class="badge">${DUNIA[s.k].i} ${label}</span><p class="q">${s.q}</p>${ui}${skillUI()}<div id="fb"></div></div>`;
  atas();
  clearInterval(tm);
  if (CONFIG.WAKTU_PER_SOAL) {
    tm = setInterval(() => {
      G.sisa -= 0.1;
      const b = $("#tbar");
      if (b) b.style.width = Math.max(0, G.sisa / CONFIG.WAKTU_PER_SOAL * 100) + "%";
      if (G.sisa <= 0) jawab(null);
    }, 100);
  }
  const inp = $("#isi"); if (inp) inp.focus();
}

function jawab(v) {
  if (G.kunci) return;
  G.kunci = true; clearInterval(tm);
  const s = G.s[G.i];
  let ok = false;
  if (v !== null) {
    if (s.t === "mc") ok = +v === s.a;
    else if (s.t === "tf") ok = (+v === 1) === s.a;
    else ok = s.a.some(x => norm(x) === norm(v));
  }
  sfx(ok ? "benar" : "salah");
  let msg;
  if (ok) {
    G.kombo++; G.benar++;
    let p = CONFIG.POIN_BENAR + (G.kombo > 1 ? CONFIG.BONUS_KOMBO * (G.kombo - 1) : 0) + Math.round(Math.max(0, G.sisa) * CONFIG.BONUS_WAKTU);
    const ganda = G.ganda; if (ganda) { p *= 2; G.ganda = false; }
    G.skor += p;
    const gc = koinGacha(1);
    msg = `✅ <b>Benar! +${p} poin${ganda ? " (ganda!)" : ""}.</b> 🎫 +${gc} Koin Gacha`;
  } else {
    G.kombo = 0;
    let kena = 1, tameng = "";
    if (G.lindung) { kena = 0; G.lindung = false; tameng = " 🛡️ Perisai skill melindungi hatimu!"; }
    else if (Math.random() * 100 < pasif("tahan")) { kena = 0; tameng = " 🛡️ Karaktermu menahan serangan!"; }
    G.nyawa -= kena;
    msg = (v === null ? "⏰ <b>Waktu habis!</b>" : "❌ <b>Belum tepat.</b>") + ` Jawaban: <b>${s.tampil}</b>` + tameng;
  }
  document.querySelectorAll("#app .btn[data-k]").forEach(b => {
    b.disabled = true;
    if (s.t !== "fill") {
      const k = +b.dataset.k, benarK = s.t === "mc" ? s.a : (s.a ? 1 : 0);
      if (k === benarK) b.classList.add("ok");
      else if (v !== null && k === +v) b.classList.add("no");
    }
  });
  const inp = $("#isi");
  if (inp) { inp.disabled = true; inp.style.borderColor = ok ? "var(--good)" : "var(--bad)"; }
  const akhir = G.nyawa <= 0 || G.i + 1 >= G.s.length;
  $("#fb").innerHTML = `<div class="fb ${ok ? "ok" : "no"}">${msg}<br>💡 ${s.e}</div>
  <button class="btn go" style="width:100%;margin-top:10px" data-k="next">${akhir ? "Lihat Hasil 🏁" : "Lanjut ➜"}</button>`;
  atas(ok ? "m" : "n");
}

function lanjut() {
  G.i++;
  if (G.nyawa <= 0 || G.i >= G.s.length) hasil(); else tanya();
}

function hasil() {
  const menang = G.nyawa > 0, dijawab = G.i, akur = G.benar / dijawab;
  const bintang = menang ? (akur >= .9 ? 3 : akur >= .7 ? 2 : 1) : 0;
  const gelar = akur >= .9 ? "Penyihir Agung" : akur >= .7 ? "Ksatria Cerdas" : akur >= .5 ? "Murid Sihir" : "Petualang Pemula";
  simpan(G.d, G.skor);
  const best = muat()[G.d] || G.skor;
  app.innerHTML = `<div class="card center"><div style="font-size:64px">${menang ? "🏆" : "💀"}</div>
  <h1>${menang ? DUNIA[G.d].mn + " Terkalahkan!" : "Kamu Tumbang…"}</h1>
  <div class="stars">${[1, 2, 3].map(n => `<span style="animation-delay:${n * .25}s">${n <= bintang ? "⭐" : "☆"}</span>`).join("")}</div>
  <p>Gelar: <b>${gelar}</b><br>${hadiah(menang)}</p>
  <p>Jawaban benar: <b>${G.benar}/${dijawab}</b><br>Skor: <b>${G.skor}</b> · 🏆 Rekor: <b>${best}</b></p>
  <div class="opts"><button class="btn go" data-a="ulang">🔁 Main Lagi</button><button class="btn" data-a="menu">🏰 Kembali ke Desa</button></div></div>`;
}

app.addEventListener("click", e => {
  const r = e.target.closest("[data-d]");
  if (r) return mulaiDunia(r.dataset.d);
  const a = e.target.closest("[data-a]");
  if (a) return a.dataset.a === "ulang" ? mulaiDunia(G.d) : keDunia();
  const b = e.target.closest("[data-k]");
  if (!b || b.disabled) return;
  const k = b.dataset.k;
  if (k === "next") return lanjut();
  if (k === "skill") return pakaiSkill();
  if (k === "isi") { const i = $("#isi"); return i.value.trim() ? jawab(i.value) : i.focus(); }
  jawab(k);
});
app.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "isi" && !e.target.disabled && e.target.value.trim()) jawab(e.target.value);
});

  for (let k = 0; k < 2; k++) { const q = (t / 260 + k * 4) % 10; ctx.globalAlpha = .6 - q * .05; ctx.beginPath(); ctx.ellipse(fx, fy + 2, 14 + q * 3, 7 + q * 1.5, 0, 0, 7); ctx.stroke(); }

// ukuran relatif tiap bentuk: hewan yang memang kecil digambar lebih kecil (dirasterisasi ulang, bukan diperkecil per piksel)
const BENTUK_KECIL = {kelinci:.75, kupu:.85, lebah:.7, katak:.7, tikus:.7, kura:.8, kalajengking:.7, kadal:.75, fenek:.75, pinguin:.9, kumbang:.75, ular:.85, ikan:.75, ubur:.7, bintang:.7, kepiting:.75, cumi:.8, gurita:.8, buntal:.7, kucing:.9, domba:.9, babi:.9};
const BENTUK_SKALA = {};
function skalaSpec(spec, k) {
  const ubah = daftar => daftar.map(q => {
    const c = q[q.length - 1];
    if (q[0] === "E") return ["E", q[1] * k, q[2] * k, q[3] * k, q[4] * k, c];
    if (q[0] === "R") return ["R", q[1] * k, q[2] * k, Math.max(1, q[3] * k), Math.max(1, q[4] * k), c];
    if (q[0] === "P") return ["P", q[1] * k, q[2] * k, c];
    if (q[0] === "L") return ["L", q[1] * k, q[2] * k, q[3] * k, q[4] * k, c];
    return ["G", q[1].map(([x, y]) => [x * k, y * k]), c];
  });
  return {
    w: Math.max(3, Math.round(spec.w * k)), h: Math.max(3, Math.round(spec.h * k)), ol: spec.ol,
    p: typeof spec.p === "function" ? (f => ubah(spec.p(f))) : ubah(spec.p || []),
    p0: spec.p0 && ubah(spec.p0), p1: spec.p1 && ubah(spec.p1)
  };
}
// spesifikasi yang sudah disesuaikan ukurannya (dihitung sekali per bentuk)
function bentukSkala(bt) {
  const spec = BENTUK[bt]; if (!spec) return null;
  const k = BENTUK_KECIL[bt] || 1;
  if (k === 1) return spec;
  return BENTUK_SKALA[bt] || (BENTUK_SKALA[bt] = skalaSpec(spec, k));
}

// ubah daftar bentuk dasar menjadi grid karakter
function rasterBentuk(spec, f) {
  const W = spec.w, H = spec.h, g = Array.from({length: H}, () => new Array(W).fill("."));
  const set = (x, y, c) => { x = Math.floor(x); y = Math.floor(y); if (x >= 0 && y >= 0 && x < W && y < H) g[y][x] = c; };
  const daftar = [...(typeof spec.p === "function" ? spec.p(f) : (spec.p || [])), ...(f === 0 ? (spec.p0 || []) : (spec.p1 || []))];
  for (const q of daftar) {
    const k = q[0], c = q[q.length - 1];
    if (k === "E") {
      const [, cx, cy, rx, ry] = q;
      for (let y = Math.floor(cy - ry) - 1; y <= Math.ceil(cy + ry) + 1; y++)
        for (let x = Math.floor(cx - rx) - 1; x <= Math.ceil(cx + rx) + 1; x++) {
          const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
          if (dx * dx + dy * dy <= 1) set(x, y, c);
        }
    } else if (k === "R") {
      const [, x0, y0, w, h] = q;
      for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) set(x, y, c);
    } else if (k === "P") {
      set(q[1], q[2], c);
    } else if (k === "L") {
      let [, x0, y0, x1, y1] = q; x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      for (;;) { set(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
    } else if (k === "G") {
      const pts = q[1];
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const px = x + .5, py = y + .5; let dalam = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const [xi, yi] = pts[i], [xj, yj] = pts[j];
          if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) dalam = !dalam;
        }
        if (dalam) set(x, y, c);
      }
    }
  }
  // tepi: sel kosong yang bersebelahan dengan badan (bukan kaki/sayap/ekor) diberi garis gelap
  if (spec.ol !== false) {
    const badan = (x, y) => x >= 0 && y >= 0 && x < W && y < H && g[y][x] !== "." && !"ABWT".includes(g[y][x]);
    const tepi = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      if (g[y][x] === "." && (badan(x - 1, y) || badan(x + 1, y) || badan(x, y - 1) || badan(x, y + 1))) tepi.push([x, y]);
    tepi.forEach(([x, y]) => { g[y][x] = "k"; });
  }
  return g;
}
function warnaPiksel(ch, pal) {
  if (ch === "A" || ch === "B") return pal.l;
  if (ch === "W") return pal.f;
  if (ch === "T") return pal.b;
  return pal[ch] || pal.b;
}
// buat gambar satu frame; baris atas ditambah 1 agar kaki/sayap yang terangkat tidak terpotong
function buatBentukCanvas(spec, pal, flip, f, jalan) {
  const g = rasterBentuk(spec, f), W = spec.w, H = spec.h;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H + 1;
  const c2 = cv.getContext("2d");
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = g[y][x]; if (ch === ".") continue;
    let dy = 0;
    if (jalan && ((ch === "A" && f === 1) || (ch === "B" && f === 0))) dy = -1;   // kaki terangkat saat melangkah
    if ((ch === "W" || ch === "T") && f === 1) dy = -1;                           // sayap & ekor naik sebentar
    const kol = flip ? W - 1 - x : x;
    c2.fillStyle = warnaPiksel(ch, pal);
    c2.fillRect(kol, y + 1 + dy, 1, 1);
  }
  return {cv, ox: Math.floor(W / 2), H: H + 1, lebar: W};
}
// gambar bentuk dengan (x, y) = tengah dan garis tanah
function gambarBentuk(id, bt, pal, x, y, flip, f = 0, jalan = false, bayangan = true, skala = 1) {
  const spec = bentukSkala(bt); if (!spec) return;
  const fr = f & 1, kunci = id + "|" + (flip ? 1 : 0) + "|" + fr + "|" + (jalan ? 1 : 0);
  let c = BENTUK_CACHE[kunci];
  if (!c) c = BENTUK_CACHE[kunci] = buatBentukCanvas(spec, pal, flip, fr, jalan);
  if (bayangan) { ctx.fillStyle = "#0002"; ctx.fillRect(Math.round(x - spec.w * .35 * skala), Math.round(y + 1), Math.round(spec.w * .7 * skala), 1); }
  // skala 2 untuk makhluk raksasa: piksel tetap tajam, garis tanah tetap di (x, y)
  ctx.drawImage(c.cv, Math.round(x - c.ox * skala), Math.round(y - (c.H - 1) * skala - skala + 1), c.lebar * skala, c.H * skala);
}
// palet = bawaan + warna khusus hewan
const palet = (ext) => { const o = Object.assign({}, PAL_DEF); for (const k in ext) if (ext[k]) o[k] = ext[k]; return o; };

async function kirimHadirRTDB() {
  if (!MP_KODE) { OTHERS = []; return; }   // mode main sendiri: tidak ada pemain lain
  const jalur = mpJalur();
  await rtdbKirim(jalur + "/" + uid, {nama, d:D, x:Math.round(pl.x), y:Math.round(pl.y), h:HI, t:Date.now()});
  const semua = await rtdbBaca(jalur), now = Date.now(), lain = [];
  for (const [id, v] of Object.entries(semua)) {
    if (!v || typeof v !== "object") continue;
    const s = lihatHadir[id];
    if (!s || s.t !== v.t) lihatHadir[id] = {t: v.t, at: !s && Math.abs(now - (+v.t || 0)) > RTDB_JEDA ? now - RTDB_JEDA - 1 : now};
    const umur = now - lihatHadir[id].at;
    if (umur > 60000 && id !== uid) rtdbHapus(jalur + "/" + id);
    if (id !== uid && umur <= RTDB_JEDA && v.d === D) lain.push(v);
  }
  OTHERS = lain.map(o => ({nama:String(o.nama || "?").slice(0, 16), x:+o.x || 0, y:+o.y || 0, h:+o.h || 0, lain:1, sp:"pemain" + (+o.h || 0)}));
}
function mpInfo(pesan = "") {
  const el = $("#mpInfo"); if (!el) return;
  el.textContent = (pesan ? pesan + "\n" : "") + (RTDB_ON ? "" : "⚠️ Belum terhubung ke Firebase: isi RTDB_URL dulu (lihat panduan).\n") + (MP_KODE ? "Room aktif: " + MP_KODE : "Mode: main sendiri");
}
function bukaMP() { on = false; mpInfo(); $("#mp").hidden = false; }
function tutupMP() {
  $("#mp").hidden = true;
  if (!on && $("#world").style.display !== "none") { on = true; last = performance.now(); requestAnimationFrame(loop); }
}
function mpMasuk(kode, pesan) {
  if (!RTDB_ON) return mpInfo("Multiplayer belum aktif.");
  if (MP_KODE && MP_KODE !== kode && uid) rtdbHapus(mpJalur() + "/" + uid);
  MP_KODE = kode; try { localStorage.setItem("arcana_room", kode); } catch (e) {}
  OTHERS = []; hadirGagal = 0; HADIR_OFF = false;
  mpInfo(pesan); kirimHadir();
}
function mpBuat() {
  const abjad = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let kode = "";
  for (let i = 0; i < 5; i++) kode += abjad[Math.floor(Math.random() * abjad.length)];
  mpMasuk(kode, "Room baru dibuat. Kode: " + kode + " (bagikan ke temanmu)");
}
function mpGabung() {
  const kode = ($("#mpKode").value || "").trim().toUpperCase();
  if (!/^[A-Z0-9]{4,8}$/.test(kode)) return mpInfo("Kode room harus 4–8 huruf/angka.");
  mpMasuk(kode, "Masuk room " + kode + ".");
}
function mpKeluar() {
  if (MP_KODE && uid && RTDB_ON) rtdbHapus(mpJalur() + "/" + uid);
  MP_KODE = ""; try { localStorage.removeItem("arcana_room"); } catch (e) {}
  OTHERS = []; mpInfo("Sekarang main sendiri.");
}
async function kirimSave(diam) {   // progres disimpan ke cloud di bawah ID browser ini
  simpanP();
  await rtdbKirim("save/" + uid, {data: localStorage.getItem("arcana_p") || "{}", nama, t: Date.now()});
  if (!diam) mpInfo("☁️ Progres tersimpan ke cloud.");
}
function simpanCloud() {
  if (!RTDB_ON || !uid) return mpInfo("Cloud save belum aktif (isi RTDB_URL).");
  kirimSave(false).catch(() => mpInfo("Gagal menyimpan ke cloud."));
}
async function muatCloud() {
  if (!RTDB_ON || !uid) return mpInfo("Cloud save belum aktif (isi RTDB_URL).");
  const s = await rtdbBaca("save/" + uid).catch(() => ({}));
  if (!s.data) return mpInfo("Belum ada save di cloud untuk browser ini.");
  localStorage.setItem("arcana_p", s.data); location.reload();
}
setInterval(() => { if (RTDB_ON && uid && P.own && P.own.length) kirimSave(true).catch(() => {}); }, 60000);
function bukaAdminKode() {
  if ($("#mpAdm").value !== ADMIN_KODE) return mpInfo("Kode admin salah.");
  ADMIN = true; $("#btnAdm").hidden = false; tutupMP(); bukaAdmin();
}

function acakHero(minR = 1) {
  const bobot = BOBOT_R.map((w, i) => (i + 1 >= minR ? w : 0));
  const tot = bobot.reduce((a, b) => a + b, 0);
  let x = Math.random() * tot, r = minR;
  for (let i = 0; i < bobot.length; i++) { x -= bobot[i]; if (bobot[i] && x < 0) { r = i + 1; break; } }
  const daftar = HERO.map((h, i) => i).filter(i => HERO[i].r === r);
  return daftar[Math.floor(Math.random() * daftar.length)];
}
// gacha 1x = 12 koin; gacha 10x = 120 koin dan tarikan ke-10 dijamin Epik ke atas bila belum ada
function tarikGacha(n) {
  const biaya = n === 10 ? 120 : 12;
  if (P.gc < biaya) return `Koin Gacha kurang. Butuh ${biaya} 🎫, kamu punya ${P.gc}. Jawab soal dulu ya! 📚`;
  P.gc -= biaya;
  sfx("gacha", n === 10);
  GACHA_TERAKHIR = [];
  for (let k = 0; k < n; k++) {
    const jaminan = n === 10 && k === n - 1 && !GACHA_TERAKHIR.some(g => HERO[g.i].r >= 3);
    const i = acakHero(jaminan ? 3 : 1), h = HERO[i];
    if (P.own.includes(i)) { const e = 30 * h.r; P.gold += e; GACHA_TERAKHIR.push({i, baru:false, emas:e}); }

  return `🎲 Gacha ${n}×: ${baru} karakter baru!`;
}

  const g = n.shake > 0 ? Math.round(Math.sin(n.shake * 50) * 2) : 0;
  const r = (c, a, b, w, h) => { ctx.fillStyle = c; ctx.fillRect(x + a + g, y + b, w, h); };
  r("#0003", -7, -1, 14, 3);
  if (n.t === "pohon") {   // kanopi bulat bertingkat seperti pohon di peta (bukan balok), batang dengan sisi gelap
    r("#6b4424", -2, -10, 4, 10); r("#4a2d17", 1, -10, 1, 10);
    r("#14532d", -4, -25, 8, 2); r("#14532d", -7, -23, 14, 3); r("#14532d", -8, -20, 16, 8); r("#14532d", -6, -12, 12, 2);   // siluet bulat gelap
    r("#15803d", -3, -24, 6, 1); r("#15803d", -6, -22, 12, 1); r("#15803d", -7, -21, 14, 8); r("#15803d", -5, -13, 10, 1);   // isi kanopi
    r("#22c55e", -4, -23, 4, 2); r("#22c55e", -6, -20, 3, 3); r("#4ade80", -4, -22, 2, 1);                               // cahaya dari kiri atas
    r("#166534", 2, -17, 5, 5);                                                                                          // bayangan kanan bawah
  } else {
    r("#4b5563", -6, -8, 12, 8); r("#6b7280", -5, -9, 10, 4); r("#9ca3af", -4, -9, 4, 2); r("#374151", -1, -4, 3, 2);
  }
}
// cahaya di bawah karakter sesuai kelangkaan (Langka ke atas), percikan untuk Legendaris
function aura(x, y, t) {
  const r = HERO[HI].r;
  if (r < 2) return;
  ctx.globalAlpha = .26 + .12 * Math.sin(t / 240);
  ctx.fillStyle = RARITAS[r - 1][1];
  ctx.beginPath(); ctx.ellipse(x, y - 1, 9 + r * 2, 3 + r, 0, 0, 7); ctx.fill();
  if (r >= 3) {
    ctx.globalAlpha = .9;
    for (let i = 0; i < 4; i++) { const a = t / 500 + i * Math.PI / 2; ctx.fillRect(Math.round(x + Math.cos(a) * (11 + r)), Math.round(y - 14 + Math.sin(a) * 6), 2, 2); }
  }
  ctx.globalAlpha = 1;
}
// pet berjalan mengikuti jejak langkahmu dengan sedikit tertinggal
function gambarPet(t) {
  if (P.pet < 0 || !PETS[P.pet] || (D === 0 && kapal.naik) || (DIM[D] && DIM[D].piramid)) return;
  const p = PETS[P.pet], sp = SPR[p.sp] || {}, ph = P.pet * 1.7;   // tiap pet punya ritme napas sendiri
  const tgt = JEJAK.length ? JEJAK[Math.max(0, JEJAK.length - 13)] : pl, lama = {x: PETPOS.x, y: PETPOS.y};
  PETPOS.x += (tgt.x - PETPOS.x) * .15; PETPOS.y += (tgt.y - PETPOS.y) * .15;
  const jalan = Math.hypot(PETPOS.x - lama.x, PETPOS.y - lama.y) > .2;
  if (Math.abs(PETPOS.x - lama.x) > .05) PETPOS.dir = PETPOS.x < lama.x ? -1 : 1;
  const x = Math.round(PETPOS.x - cam.x), y = Math.round(PETPOS.y - cam.y);
  // aura legendaris yang berdenyut di bawah pet
  ctx.globalAlpha = .22 + .12 * Math.sin(t / 260 + ph); ctx.fillStyle = p.warna;
  ctx.beginPath(); ctx.ellipse(x, y - 2, 11, 4, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = "#0005"; ctx.fillRect(x - 5, y - 1, 10, 3);
  // berjalan: melompat kecil; diam: napas pelan
  const yb = y + (jalan ? Math.round(Math.sin(t / 110)) : Math.round(Math.sin(t / 480 + ph)));
  const bw = sp.bw || 14, l = -bw / 2 | 0;
  if (sp.naga) naga(x, yb, t, sp.naga, .42); else if (sp.bt) gambarPetBentuk(sp, x, yb, t, jalan); else bestia(x, yb, sp);
  // dua kilau berputar mengelilingi pet legendaris
  for (let k = 0; k < 2; k++) { const a = t / 380 + k * Math.PI + ph; ctx.fillStyle = p.warna; ctx.fillRect(Math.round(x + Math.cos(a) * 11), Math.round(yb - 14 + Math.sin(a) * 5), 1, 1); }
  if (!jalan && !sp.bt) {
    // diam: ekor bergoyang dan mata berkedip sesekali
    ctx.fillStyle = sp.m || sp.c; ctx.fillRect(x + l - 4, yb - 12 + (Math.sin(t / 170 + ph) > 0 ? -1 : 0), 2, 2);
    if ((t + ph * 500) % 3600 < 130) { ctx.fillStyle = sp.c; ctx.fillRect(x + l + bw + 1, yb - 15, 1, 1); }
  }
  // efek khusus naga: semburan api kecil
  if (p.fx === "api" && Math.random() < .3) partikel(PETPOS.x + 8, PETPOS.y - 16, ["#fb923c", "#fde047", "#ef4444"], 2, 22, .35);
}
// dipanggil tiap frame: arah hadap, jejak pet, dan kebangkitan pohon/batu
// kincir angin (v8): menara kayu, atap kerucut, dan empat baling-baling yang berputar pelan; digambar tiap frame di atas peta
function gambarKincir(k, t) {
  const x = Math.round(k.x - cam.x), y = Math.round(k.y - cam.y);   // (x, y) = tengah dasar menara
  if (x < -40 || x > VW + 40 || y < -50 || y > VH + 20) return;
  ctx.fillStyle = "#0003"; ctx.fillRect(x - 9, y, 19, 3);
  for (let r = 0; r < 24; r++) {                                   // menara makin sempit ke atas
    const w = Math.round(8 - r / 6);
    ctx.fillStyle = r % 4 === 3 ? "#8a5a2a" : "#c8925a";
    ctx.fillRect(x - w, y - 3 - r, w * 2, 1);
  }
  ctx.fillStyle = "#3b2615"; ctx.fillRect(x - 2, y - 6, 4, 3);     // pintu
  ctx.fillStyle = "#fde68a"; ctx.fillRect(x - 1, y - 14, 2, 3);    // jendela
  for (let r = 0; r < 6; r++) {                                    // atap kerucut
    const w = 6 - r;
    ctx.fillStyle = r % 2 ? "#b45309" : "#d97706";
    ctx.fillRect(x - w, y - 27 - r, w * 2, 1);
  }
  const hx = x, hy = y - 33;                                       // poros baling-baling
  for (let i = 0; i < 4; i++) {
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(t / 420 + i * Math.PI / 2);
    ctx.fillStyle = "#6d4f28"; ctx.fillRect(0, -1, 16, 2);
    ctx.fillStyle = "#f5efd9"; ctx.fillRect(3, -7, 11, 6);
    ctx.fillStyle = "#c8b89a"; ctx.fillRect(3, -7, 11, 1);
    ctx.restore();
  }
  ctx.fillStyle = "#6d4f28"; ctx.fillRect(hx - 2, hy - 2, 4, 4);
}
function urusDunia(dt, dx, dy, m) {
  if (m) arahB = {x: dx / m, y: dy / m};
  if (JEJAK.length && Math.hypot(JEJAK[JEJAK.length - 1].x - pl.x, JEJAK[JEJAK.length - 1].y - pl.y) > 60) { JEJAK.length = 0; PETPOS = {x: pl.x, y: pl.y}; }   // pindah tempat (portal, kapal): jejak lama dibuang
  const ujung = JEJAK[JEJAK.length - 1];
  if (!ujung || Math.hypot(ujung.x - pl.x, ujung.y - pl.y) > 2) { JEJAK.push({x:pl.x, y:pl.y}); if (JEJAK.length > 40) JEJAK.shift(); }
  for (const n of TEBANG) {
    if (n.shake > 0) n.shake -= dt;
    if (n.habis > 0) {
      n.habis -= dt;
      if (n.habis <= 0) {
        if (Math.hypot(n.x - pl.x, n.y - pl.y) < 16) n.habis = .5;   // tunggu sampai kamu menjauh
        else { n.habis = 0; n.hp = null; SOLID.push(n.box); }
      }
    }
  }
}

function beliToko(id) {
  const x = [...TOKO_MAKAN, ...TOKO_MINUM, ...AKSESORIS].find(b => b.id === id);
  if (!x) return gambarToko("Barang tidak ditemukan.");
  if (x.slot && P.acc.includes(id)) return gambarToko("Aksesoris itu sudah kamu miliki.");
  if (P.gold < x.harga) return gambarToko(`🪙 Koin kurang. ${x.n} harganya ${x.harga}.`);
  P.gold -= x.harga;
  let info;
  if (x.slot) {
    P.acc.push(id);
    if (!P.pakai[x.slot]) { P.pakai[x.slot] = id; info = " Langsung dipakai!"; } else info = " Pakai dari 🎒 Tas.";
  } else { P.inv[id] = (P.inv[id] || 0) + 1; info = " Simpan di 🎒 Tas untuk dimakan atau diminum."; }
  simpanP(); sfx("ambil");
  gambarToko(`✔ ${x.e} ${x.n} dibeli (-🪙 ${x.harga}).${info}`);
}
function pakaiMakanan(jenis, id) {
  const x = (jenis === "makan" ? TOKO_MAKAN : TOKO_MINUM).find(b => b.id === id);
  if (!x || !(P.inv[id] > 0)) return bukaTas("Barang itu sudah habis.");
  if (jenis === "makan" && P.hp >= 100) return bukaTas("HEALTH kamu sudah penuh.");
  if (jenis === "minum" && P.en >= 100) return bukaTas("ENERGY kamu sudah penuh.");
  P.inv[id]--;
  if (jenis === "makan") P.hp = Math.min(100, P.hp + x.h); else P.en = Math.min(100, P.en + x.en);
  partikel(pl.x, pl.y - 8, jenis === "makan" ? ["#fca5a5", "#fde68a"] : ["#93c5fd", "#67e8f9"], 10, 30, .5);
  sfx("ambil"); simpanP();
  bukaTas(`${x.e} ${x.n} habis: ${x.ket}.`);
}
function pasangAks(id) {
  const x = AKSESORIS.find(b => b.id === id);
  if (!x || !P.acc.includes(id)) return bukaTas("Aksesoris itu belum kamu miliki.");

  P.pakai[x.slot] = id; simpanP(); sfx("skill");

function partikel(x, y, warna, n = 8, kec = 45, hidup = .55) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = kec * (.35 + Math.random() * .9);
    FX.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s * .8 - 25, life: hidup * (.6 + Math.random() * .6), max: hidup, c: Array.isArray(warna) ? warna[i % warna.length] : warna, u: Math.random() < .3 ? 2 : 1});
  }

}
function urusFX(dt) {
  for (const p of FX) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 110 * dt; }
  for (let i = FX.length - 1; i >= 0; i--) if (FX[i].life <= 0) FX.splice(i, 1);
  for (const f of FT) { f.life -= dt; f.y -= 20 * dt; }
  for (let i = FT.length - 1; i >= 0; i--) if (FT[i].life <= 0) FT.splice(i, 1);

}

function urusMusuh(m, dt) {

  const dx = pl.x - m.x, dy = pl.y - m.y, d = Math.hypot(dx, dy) || 1;

  if (m.mode === "kejar") {
    if (T.ranged) {
      if (d < 64) pindahkan(m, -dx / d, -dy / d, T.kec * dt);
      else if (d > 100) pindahkan(m, dx / d, dy / d, T.kec * dt);
      if (m.cd <= 0 && d < 150) { m.cd = T.cd; PIR.proj.push({x: m.x, y: m.y - 4, vx: dx / d * 70, vy: dy / d * 70, hidup: 2, dmg: T.dmg, dari: "mus", r: 3, jenis: "ludah"}); }

    m.pt -= dt;
    if (m.pt <= 0) { m.pt = 1.5 + Math.random() * 2; m.tx = m.hx + (Math.random() - .5) * 60; m.ty = m.hy + (Math.random() - .5) * 60; }
    const ex = m.tx - m.x, ey = m.ty - m.y, ed = Math.hypot(ex, ey);

   RUANG ADMIN — hanya untuk admin (pemilik / editor).
   Penulisan tetap dijaga di sisi database (aturan 'admin'),
   jadi pemain biasa tidak bisa menghapus atau mereset peringkat
   walau mencoba lewat konsol.
   ===================================================== */
let admData = [], admHapus = null, admKonf = "", admLog = "";
const admBisaReset = () => admKonf.trim().toUpperCase() === "RESET";
async function bukaAdmin() {
  if (!ADMIN || (!db && !RTDB_ON)) return;
  $("#lb").classList.remove("on"); $("#dlg").classList.remove("on");
  tampilApp();                        // tampilApp menghentikan game dan menampilkan area app (lebar, tidak terpotong)
  app.innerHTML = '<div class="adm-page"><p>Memuat data pemain…</p></div>';
  await segarkanAdmin();
}
async function segarkanAdmin() {
  if (RTDB_ON) {   // GitHub Pages: peringkat ada di Realtime Database
    try { admData = Object.entries(await rtdbBaca("papan")).filter(([, v]) => v && typeof v === "object").map(([id, v]) => ({id, ...v})).sort((a, b) => (Number(b.power) || 0) - (Number(a.power) || 0)); }
    catch (err) { admLog = "Gagal memuat data: " + ((err && err.message) || err); }
    return gambarAdmin();
  }
  try {
    const sn = await db.collection("lb").get();
    admData = sn.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (Number(b.power) || 0) - (Number(a.power) || 0));
  } catch (err) { admLog = "Gagal memuat data: " + ((err && err.message) || err); }
  gambarAdmin();
}
function gambarAdmin() {
  const n = admData.length, total = admData.reduce((a, x) => a + (Number(x.power) || 0), 0);
  const rataLv = n ? Math.round(admData.reduce((a, x) => a + (Number(x.lv) || 1), 0) / n) : 0;
  app.innerHTML = `<div class="adm-page"><div class="adm-h"><b>🛠️ Ruang Admin</b><span style="font-size:12px;color:#fde68a">Musim ${MUSIM}</span></div>
  <div class="adm-stat"><div><b>${n}</b><small>pemain</small></div><div><b>${total}</b><small>total power</small></div><div><b>${rataLv}</b><small>rata-rata Lv</small></div></div>
  <div>${admData.length ? admData.map((x, i) => `<div class="adm-row"><span>${i + 1}.</span><span class="nm">${esc(x.nama || "?")}</span><b>⚔️ ${Number(x.power) || 0}</b><small>Lv ${Number(x.lv) || 1}</small><button data-adm="del" data-id="${esc(x.id)}" class="${admHapus === x.id ? "arm" : ""}">${admHapus === x.id ? "Yakin?" : "🗑️"}</button></div>`).join("") : '<p style="opacity:.8">Belum ada pemain yang tercatat.</p>'}</div>
  <div class="adm-reset"><b>🔄 Reset musim</b>
    <p style="margin:4px 0;font-size:12px">Menghapus SEMUA peringkat dan mengulang progres semua pemain dari awal. Ketik <b>RESET</b> lalu tekan tombol.</p>
    <div class="lbn" style="margin:0"><input id="admKonf" maxlength="5" autocomplete="off" placeholder="RESET" value="${esc(admKonf)}"><button class="btn bad" data-adm="reset" ${admBisaReset() ? "" : "disabled"}>Reset</button></div>
  </div>
  <div class="adm-log">${esc(admLog)}</div>
  <div class="lbn" style="margin:8px 0 0"><button class="btn go" data-adm="segar" style="flex:1">↻ Muat ulang</button><button class="btn" data-adm="x" style="flex:1">Tutup</button></div></div>`;
}

app.addEventListener("click", async e => {
  const b = e.target.closest("[data-adm]");
  if (!b || !ADMIN || (!db && !RTDB_ON)) return;
  const a = b.dataset.adm;
  if (a === "x") return keDunia();

    return segarkanAdmin();
  }
  if (a === "reset" && admBisaReset()) {  // musim baru: semua peringkat dihapus, progres pemain ikut dimulai ulang
    try {
      if (RTDB_ON) {   // GitHub Pages: hapus papan & naikkan musim di Realtime Database
        const n = Object.keys(await rtdbBaca("papan")).length;

      await db.doc("meta/musim").set({n: MUSIM + 1, t: Date.now()});
      admLog = `Musim baru dimulai. ${sn.docs.length} peringkat dihapus.`;
      admKonf = "";
    } catch (err) { admLog = "Gagal reset: " + ((err && err.message) || err); }
    return segarkanAdmin();
  }
});
